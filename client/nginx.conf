server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de upload (PDFs de exámenes)
    client_max_body_size 50M;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Assets con cache largo
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Proxy a microservicios ──
    location /api/users/ {
        proxy_pass http://apolo-users:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/exams/ {
        proxy_pass http://apolo-exams:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeouts altos para upload + procesamiento (compresión PDF, sharp, etc.)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Permitir uploads grandes sin que Nginx los bufferee primero
        proxy_request_buffering off;
        client_body_buffer_size 128k;
    }

    location ^~ /api/images/ {
        proxy_pass http://apolo-exams:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /api/pdfs/ {
        proxy_pass http://apolo-exams:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # /api/exam/ (singular) → ExamsAttempts
    location /api/exam/ {
        proxy_pass http://apolo-attempts:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket de socket.io (ExamsAttempts)
    location /socket.io/ {
        proxy_pass http://apolo-attempts:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # SPA: cualquier ruta que no sea un archivo ni una API devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
