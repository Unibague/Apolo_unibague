services:
  apolo-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: apolo-frontend
    restart: unless-stopped
    ports:
      - "3090:80"
    networks:
      - apolo-network

  apolo-postgres:
    image: postgres:16
    container_name: apolo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${USERS_DB_NAME}
      EXAMS_DB_NAME: ${EXAMS_DB_NAME}
      ATTEMPTS_DB_NAME: ${ATTEMPTS_DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - apolo_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - apolo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${USERS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  apolo-users:
    build:
      context: ./server/Users
      dockerfile: Dockerfile
    container_name: apolo-users
    restart: unless-stopped
    depends_on:
      apolo-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: apolo-postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${USERS_DB_NAME}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      EXAMS_MS_URL: http://apolo-exams:3001
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "3100:3000"
    networks:
      - apolo-network

  apolo-exams:
    build:
      context: ./server/Exams
      dockerfile: Dockerfile
    container_name: apolo-exams
    restart: unless-stopped
    depends_on:
      apolo-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3001
      HOST: 0.0.0.0
      DB_HOST: apolo-postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${EXAMS_DB_NAME}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      SERVICE_SECRET: ${SERVICE_SECRET}
      USERS_MS_URL: http://apolo-users:3000
      EXAM_ATTEMPTS_MS_URL: http://apolo-attempts:3002
      CORS_ORIGIN: ${FRONTEND_URL}
      UPLOADS_DIR: /app/uploads
    ports:
      - "3101:3001"
    volumes:
      - apolo_uploads_data:/app/uploads
    networks:
      - apolo-network

  apolo-attempts:
    build:
      context: ./server/ExamsAttempts
      dockerfile: Dockerfile
    container_name: apolo-attempts
    restart: unless-stopped
    depends_on:
      apolo-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3002
      HOST: 0.0.0.0
      DB_HOST: apolo-postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${ATTEMPTS_DB_NAME}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      SERVICE_SECRET: ${SERVICE_SECRET}
      USER_MS_URL: http://apolo-users:3000
      EXAM_MS_URL: http://apolo-exams:3001
      CORS_ORIGIN: ${FRONTEND_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - "3102:3002"
    networks:
      - apolo-network

networks:
  apolo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.0.0/24

volumes:
  apolo_postgres_data:
    driver: local
  apolo_uploads_data:
    driver: local
